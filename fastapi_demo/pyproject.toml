[project]
name = "software-reco"
version = "0.1.0"
description = "FastAPI-based RAG application for software engineering resource recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["node_modules", ".venv", "chroma_db*", "ingest_docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = ["T201", "T203"]  # allow print in eval scripts

[tool.ruff.lint.per-file-ignores]
"evaluation/*.py" = ["T201", "T203"]
"software_recommend_system/run_agent.py" = ["T201", "T203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["tests/", "evaluation/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
