services:
  fastapi:
    build: ./fastapi_demo
    ports:
      - "8000:8000"
    env_file:
      - path: ./fastapi_demo/.env
        required: false
    environment:
      - CHROMA_DB_PATH=/data/chroma
      - INGEST_PATH=/data/ingest
    volumes:
      - fastapi_chroma:/data/chroma
      - ./fastapi_demo/ingest_docs:/data/ingest:ro
    restart: unless-stopped

  spring-boot:
    build: ./ollama_springboot/demo
    ports:
      - "8080:8080"
    environment:
      - APP_FASTAPI_BASE_URL=http://fastapi:8000
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:software_reco;MODE=PostgreSQL
    depends_on:
      - fastapi
    restart: unless-stopped

  frontend:
    build:
      context: ./ollama_springboot/ollama-gui-reactjs
      args:
        REACT_APP_CHAT_API_URL: http://localhost:8080/api/chat
    ports:
      - "3000:80"
    depends_on:
      - spring-boot

volumes:
  fastapi_chroma:
