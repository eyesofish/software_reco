services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: software_reco
      POSTGRES_USER: software_reco
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "software_reco", "-d", "software_reco"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  fastapi:
    build: ./fastapi_demo
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./fastapi_demo/.env
        required: false
      - path: ./.runtime/auth-demo.env
        required: true
    environment:
      - CHROMA_DB_PATH=/data/chroma
      - INGEST_PATH=/data/ingest
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SESSION_STATE_DB=/data/chat/session-state.sqlite3
      - MEMORY_STORE_DB=/data/chat/layered-memory.sqlite3
      - SESSION_STATE_FILE=/data/legacy/fastapi_session_state.json
      - MEMORY_STORE_FILE=/data/legacy/layered_memory_store.json
    depends_on:
      elasticsearch:
        condition: service_started
    volumes:
      - fastapi_chroma:/data/chroma
      - fastapi_chat:/data/chat
      - ./.runtime/legacy-agent:/data/legacy:ro
      - ./fastapi_demo/ingest_docs:/data/ingest:ro
    restart: unless-stopped

  spring-boot:
    build: ./ollama_springboot/demo
    ports:
      - "8080:8080"
    env_file:
      - path: ./.runtime/auth-demo.env
        required: true
    environment:
      - APP_FASTAPI_BASE_URL=http://fastapi:8000
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://postgres:5432/software_reco
      - DB_USER=software_reco
      - SPRING_CONFIG_IMPORT=configtree:/run/secrets/
    secrets:
      - source: db_password
        target: DB_PASSWORD
    depends_on:
      fastapi:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./ollama_springboot/ollama-gui-reactjs
      args:
        REACT_APP_CHAT_API_URL: http://localhost:8080/api/chat
    ports:
      - "3000:80"
    depends_on:
      - spring-boot

volumes:
  postgres_data:
  fastapi_chat:
  fastapi_chroma:
  elasticsearch_data:

secrets:
  db_password:
    file: ./.runtime/postgres-password
