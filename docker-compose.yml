services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  fastapi:
    build: ./fastapi_demo
    ports:
      - "8000:8000"
    env_file:
      - path: ./fastapi_demo/.env
        required: false
    environment:
      - CHROMA_DB_PATH=/data/chroma
      - INGEST_PATH=/data/ingest
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_started
    volumes:
      - fastapi_chroma:/data/chroma
      - ./fastapi_demo/ingest_docs:/data/ingest:ro
    restart: unless-stopped

  spring-boot:
    build: ./ollama_springboot/demo
    ports:
      - "8080:8080"
    environment:
      - APP_FASTAPI_BASE_URL=http://fastapi:8000
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:software_reco;MODE=PostgreSQL
    depends_on:
      - fastapi
    restart: unless-stopped

  frontend:
    build:
      context: ./ollama_springboot/ollama-gui-reactjs
      args:
        REACT_APP_CHAT_API_URL: http://localhost:8080/api/chat
    ports:
      - "3000:80"
    depends_on:
      - spring-boot

volumes:
  fastapi_chroma:
  elasticsearch_data:
