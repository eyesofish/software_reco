name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi_demo
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Offline local checks
        run: python -m evaluation.local_checks
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-checks-python-${{ matrix.python-version }}
          path: |
            fastapi_demo/evaluation/reports/checks/**
            !fastapi_demo/evaluation/reports/checks/**/chroma/**
          include-hidden-files: true
          retention-days: 14

  java:
    name: Java (Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chat_test
          POSTGRES_USER: chat_test
          POSTGRES_PASSWORD: chat_ci_password
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -h 127.0.0.1 -U chat_test -d chat_test" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ollama_springboot/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build & test
        run: mvn -B verify
      - name: Chat acceptance on PostgreSQL
        env:
          SPRING_PROFILES_ACTIVE: postgres
          CHAT_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/chat_test
          DB_USER: chat_test
          DB_PASSWORD: chat_ci_password
        run: mvn -B -Dtest=BusinessAuthIntegrationTests test
