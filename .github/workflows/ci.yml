name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi_demo
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Offline local checks
        run: python -m evaluation.local_checks
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-checks-python-${{ matrix.python-version }}
          path: |
            fastapi_demo/evaluation/reports/checks/**
            !fastapi_demo/evaluation/reports/checks/**/chroma/**
          include-hidden-files: true
          retention-days: 14

  java:
    name: Java (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ollama_springboot/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build & test
        run: mvn -B verify -DskipTests=false 2>&1 | tail -50
